name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout VaultWrite library
        uses: actions/checkout@v4
        with:
          repository: pawelkat/VaultWrite
          path: VaultWrite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Assemble debug
        run: ./gradlew -PvaultWriteDir=$GITHUB_WORKSPACE/VaultWrite :app:assembleDebug --stacktrace
      - name: Unit tests
        run: ./gradlew -PvaultWriteDir=$GITHUB_WORKSPACE/VaultWrite :app:testDebugUnitTest :vaultwrite:testDebugUnitTest --stacktrace
